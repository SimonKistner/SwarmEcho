name: Build cluster dependency image

on:
  workflow_dispatch:
  push:
    paths:
      - 'cluster/Dockerfile'
      - 'cluster/settings.json'
      - 'cluster/submit.py'
      - 'cluster/prepare_context.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/cluster-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: swarmecho-dependency-image
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image and prepare inputs
        shell: bash
        run: |
          python3 cluster/submit.py --image-info > image-info.json
          IMAGE=$(jq -r .image image-info.json)
          case "$IMAGE" in *REPLACE_*) echo 'Configure image_repository first'; exit 1;; esac
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          mkdir image-context
          cp pyproject.toml uv.lock README.md image-context/
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish
        run: |
          docker build --platform linux/amd64 -f cluster/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE" image-context
          docker push "$IMAGE"
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
