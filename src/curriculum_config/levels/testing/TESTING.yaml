# Level 00

env:
  map_names: ["M02_small_grid_maze"]
  num_agents: 1
  max_steps: 200               # episode length
  num_targets: 1
  num_bases: 1

# 128, 256, 512, 1024, 2048, 4096, 8192, 16384

training:
  total_timesteps: 1_500_000
  num_envs: 4096              # parallel vectorised environments (vmap)
  num_steps: 64               # rollout horizon per PPO update
  num_epochs: 1              # PPO gradient epochs per collected batch
  num_minibatches: 16           # batch split into this many minibatches per epoch
  eval_parallel: true

reward:
  only_shortest_path_chain_reward: True

network:
  critic_type: "agent_centric" # "agent_centric" (recommended) | "global_mean"

logging:
  eval_freq:  2
  eval_video_freq:  2
  checkpoint_freq: 5
  eval_failed_chain_heatmap: true  # Generate heatmap of target positions for failed chain deliveries from sliding window
  eval_not_delivered_or_visually_found_heatmap: true  # Generate heatmap of target positions not delivered/visually found




