# Toy diagnostic: one drone learns target -> base delivery -> target revisit.
# The map is an unobstructed 40x20 m field with base/drone fixed at (20, 10)
# and target fixed 12 m to the right at (32, 10).

env:
  map_names: ["toy_back_to_target"]
  num_agents: 1
  num_targets: 1
  num_bases: 1
  max_steps: 200
  visual_radius: 5.0
  comm_radius: 5.0
  comm_radius_base: 5.0
  spawn_delay: 0
  use_random_base_spawn: false
  use_random_drone_spawn: false
  target_spawn_method: map_defined
  precover_base_comm: false
  observe_target_vector: false
  observe_base_vector: false

reward:
  every_reward_global: false
  only_explor_individual: false
  only_shortest_path_chain_reward: false
  target_found_requires_delivery: true
  back_to_target_after_delivery: true
  exploration_bonus: 0.01
  target_found_bonus: 0.0
  finder_bonus: 50.0
  max_gap_penalty: 0.0
  success_bonus: 0.0
  base_proximity_bonus: 0.0
  target_proximity_bonus: 0.0
  proximity_penalty: 0.0
  collision_penalty: 0.1

training:
  total_timesteps: 100_000_000
  num_envs: 4000
  num_steps: 100
  num_epochs: 1
  num_minibatches: 20

network:
  critic_type: "agent_centric"
  actor_memory: true
  critic_memory: true
  memory_comm_enabled: false
  num_layers: 3
  actor_num_layers: 3

logging:
  eval_freq: 100000
  save_model: false

  eval_video_freq: 75  # Only render a single-episode tracking video every 200 updates
  eval_video: true
