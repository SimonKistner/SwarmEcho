
env:
  map_names: ["M04a_tiny_grid_maze"]
  num_agents: 6
  num_targets: 1
  num_bases: 1
  max_steps: 700
  visual_radius: 5.0
  max_speed: 5   # 10.0 * 5/12
  max_force: 15  # 50.0 * 5/12
  comm_radius: 15       # 50.0 * 5/12
  comm_radius_base: 16.67  # 40.0 * 5/12
  spawn_delay: 5
  use_random_base_spawn: false
  use_random_drone_spawn: false
  target_spawn_method: map_defined   # spawn from wall-buffered valid_target_coords (see M03_small_grid_maze.yaml)
  adaptive_target_spawn: false
  static_maze_optimal_path: true
  precover_base_comm: false
  hold_chain_for: 50
  observe_target_vector: false
  observe_base_vector: false
  observe_coverage_probe: false

reward:
  every_reward_global: false
  only_explor_individual: false
  only_shortest_path_chain_reward: true
  target_found_requires_delivery: true
  back_to_target_after_delivery: false
  chain_reward_system: discrete_finders_path
  only_reward_chain_from_target: false

  # --- Local Rewards (Not divided by N) ---
  exploration_bonus: 0.25
  finder_bonus:  50.0
  max_gap_penalty: 5.0      # absolute penalty when gap is at its maximum
  target_found_bonus: 100.0
  success_bonus: 500.0

training:
  total_timesteps: 250_000_000
  num_envs: 4000
  num_steps: 100
  num_epochs: 4
  num_minibatches: 20
  seed: 6302026950

  eval_parallel: true
  eval_parallel_envs: 4000
  eval_parallel_early_exit_threshold: 1.0

  #checkpoint_path:  "outputs/mini_maze_adpTargetSpawn_v2/checkpoints/ckpt_001000"  # if set, resumes training from this path
  #ckpt_loading_mode: "resume"  # "resume" (continue update count and WandB run) or "branch" (start update 0 and new WandB run)

network:
  critic_type: "agent_centric"
  num_layers: 3    # critic depth
  actor_num_layers: 3    # actor depth (lighter, separate)
  actor_memory: true
  critic_memory: true
  memory_comm_enabled: true
  memory_comm_every_k_steps: 5
  tarmac_sig_dim: 16
  tarmac_val_dim: 32
  tarmac_include_self: false

curriculum:
  success_threshold: 0.9
  metric: "success"             # "success" or "target_found"
  mode: "eval"                 # "train" or "eval"

logging:
  eval_broadcast_on_curriculum_early_stop: true

  adaptive_spawn_diagnostics: false
  checkpoint_freq: 50
  checkpoint_offset: 0

  eval_freq: 20
  eval_offset: 1
  eval_not_delivered_or_visually_found_heatmap: true

  eval_video: true
  eval_video_freq: 50
  eval_video_offset: 1
