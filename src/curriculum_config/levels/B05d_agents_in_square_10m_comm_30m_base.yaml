# Level B05d
#
env:
  map_names: ["square_B04_10m_comm_20m_base"]
  num_agents: 9
  spawn_delay: 5
  max_steps: 600
  use_random_base_spawn: false
  use_random_drone_spawn: false
  target_spawn_method: outside_base
  target_invalid_spawn_base_radius: 35.0
  precover_base_comm: true
  hold_chain_for: 50                      # number of consecutive timesteps the chain must be held before success


reward:
  every_reward_global: false
  only_explor_individual: true
  only_shortest_path_chain_reward: false
  target_found_requires_delivery: true

# 128, 256, 512, 1024, 2048, 4096, 8192, 16384

training:
  total_timesteps: 2_000_000
  num_envs: 4096
  num_steps: 64
  num_epochs: 10
  num_minibatches: 16

curriculum:
  success_threshold: 0.999

logging:
  video_freq: 20
