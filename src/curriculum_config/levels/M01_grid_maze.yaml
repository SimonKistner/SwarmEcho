# M01 Grid Maze – single target, relay-chain training.
# Map: 9×9 cell grid, 24 m per cell (cell = visual_radius × 2), 216×216 m total.

env:
  map_names: ["M01_grid_maze"]
  num_agents: 8
  max_steps: 550
  visual_radius: 12.0
  comm_radius: 50.0
  comm_radius_base: 40.0
  spawn_delay: 5
  hold_chain_for: 50

reward:
  target_found_requires_delivery: true

training:
  total_timesteps: 500_000_000
  num_envs: 4096
  num_steps: 64
  num_epochs: 10
  num_minibatches: null

network:
  actor_memory: true
  critic_memory: true

evaluation:
  eval_freq: 50
  early_exit: true
  early_exit_threshold: 0.99
