# M01 Grid Maze – single target, relay-chain training.
# Map: 9×9 cell grid, 24 m per cell (cell = visual_radius × 2), 216×216 m total.

env:
  map_names: ["M01_grid_maze"]
  num_agents: 8
  num_targets: 1
  num_bases: 1
  max_steps: 550
  visual_radius: 12.0
  exploration_sampling_radius: 13.0
  comm_radius: 50.0
  comm_radius_base: 40.0
  spawn_delay: 5
  use_random_base_spawn: false
  use_random_drone_spawn: false
  target_spawn_method: map_defined   # spawn from wall-buffered valid_target_coords (see M01_grid_maze.yaml)
  precover_base_comm: true
  hold_chain_for: 50

reward:
  every_reward_global: false
  only_explor_individual: true
  only_shortest_path_chain_reward: false
  target_found_requires_delivery: true

training:
  total_timesteps: 500_000_000
  num_envs: 4096
  num_steps: 64
  num_epochs: 10
  num_minibatches: 16

network:
  critic_type: "agent_centric"
  actor_memory: true
  critic_memory: true

curriculum:
  success_threshold: 0.99

logging:
  video_freq: 50
