# M02 Small Grid Maze – single target, relay-chain training.
# Map: 9×9 cell grid, 10 m per cell (cell = visual_radius × 2), 90×90 m total.
# Mathematically scaled down version of M01_grid_maze (scale factor 5/12).

env:
  map_names: ["M02_small_grid_maze"]
  num_agents: 8
  num_targets: 1
  num_bases: 1
  max_steps: 800
  visual_radius: 5.0
  max_speed: 4.17   # 10.0 * 5/12
  max_force: 20.83  # 50.0 * 5/12
  comm_radius: 20.83       # 50.0 * 5/12
  comm_radius_base: 16.67  # 40.0 * 5/12
  spawn_delay: 5
  use_random_base_spawn: false
  use_random_drone_spawn: false
  target_spawn_method: map_defined   # spawn from wall-buffered valid_target_coords (see M02_small_grid_maze.yaml)
  precover_base_comm: true
  hold_chain_for: 50
  observe_target_vector: false
  observe_base_vector: false
  terminate_on_target_found: false

reward:
  every_reward_global: false
  only_explor_individual: false
  only_shortest_path_chain_reward: true
  target_found_requires_delivery: true
  back_to_target_after_delivery: false
  chain_reward_system: discrete_finders_path
  only_reward_chain_from_target: false

  # --- Local Rewards (Not divided by N) ---
  exploration_bonus: 0.25
  finder_bonus:  50.0
  max_gap_penalty: 0.0      # absolute penalty when gap is at its maximum
  target_found_bonus: 100.0
  success_bonus: 0.0

training:
  total_timesteps: 100_000_000
  num_envs: 4000
  num_steps: 100
  num_epochs: 4
  num_minibatches: 20

  eval_parallel: true
  eval_parallel_envs: 4000
  eval_parallel_early_exit_threshold: 1.0

network:
  critic_type: "agent_centric"
  num_layers: 3    # critic depth
  actor_num_layers: 3    # actor depth (lighter, separate)
  actor_memory: true
  critic_memory: true
  memory_comm_enabled: true
  memory_comm_every_k_steps: 1
  tarmac_sig_dim: 64
  tarmac_val_dim: 128
  tarmac_include_self: true

logging:
  memory_diagnostic_probe: false

  checkpoint_freq: 50
  checkpoint_offset: 0

  eval_freq: 20
  eval_offset: 1

  eval_video: true
  eval_video_freq: 50
  eval_video_offset: 1

curriculum:
  success_threshold: 0.99
  metric: target_found
  mode: eval






