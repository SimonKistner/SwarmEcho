# Level 01: Warehouse Geometry
# ------------------------------
# Goal: Navigate around bulky obstacles (crates) using local coverage info.
# Task logic is disabled. 
env:
  map_names: ["warehouse"]
  num_agents: 15
  max_steps: 1000
  num_targets: 1
  num_bases: 1


# 128, 256, 512, 1024, 2048, 4096, 8192, 16384              

training:
  total_timesteps: 300_000_000
  num_envs: 4096              # parallel vectorised environments (vmap)
  num_steps: 64               # rollout horizon per PPO update
  num_epochs: 10               # PPO gradient epochs per collected batch
  num_minibatches: 16           # batch split into this many minibatches per epoch

reward:  
  only_shortest_path_chain_reward: True


network:
  critic_type: "agent_centric" # "agent_centric" (recommended) | "global_mean"

logging:
  video_freq: 40
