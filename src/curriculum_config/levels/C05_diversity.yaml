# Level C05: B05d map/task with forward-history diversity enabled.
#
# This keeps the B05d task shape and adds CDS-inspired MAPPO role diversity:
# 9 agents, 3 reusable roles, history-based shared-vs-role next-observation prediction.

env:
  map_names: ["square_B04_10m_comm_20m_base"]
  num_agents: 9
  spawn_delay: 5
  max_steps: 600
  use_random_base_spawn: false
  use_random_drone_spawn: false
  target_spawn_method: outside_base
  target_invalid_spawn_base_radius: 35.0
  precover_base_comm: true
  hold_chain_for: 20

reward:
  only_shortest_path_chain_reward: true

training:
  total_timesteps: 200_000_000
  num_envs: 4096
  num_steps: 64
  num_epochs: 10
  num_minibatches: 16

diversity:
  enabled: true
  method: forward_history
  num_roles: 3
  history_len: 10
  beta: 0.05
  aux_coef: 1.0
  l1_coef: 0.002
  reward_clip: 1.0
  normalize_intrinsic: true
  adapter_scale: 0.25
  predictor_hidden_dim: 128
  predictor_num_layers: 2

curriculum:
  success_threshold: 0.999

logging:
  wandb_mode: online
  video_freq: 20
