# Environment ----------------------------------------------------------------
env:
  num_agents: 8           # N — number of drones in the swarm
  box_width: 500.0        # metres
  box_height: 100.0       # metres
  dt: 0.1                 # seconds per physics timestep
  visual_radius: 15.0     # metres — drone can see target if within this range
  comm_radius: 50.0       # metres — comm link established if within this range
  max_speed: 10.0         # metres/sec — velocity clamp
  drag: 0.85              # velocity retained per step (1.0 = no drag)
  wall_restitution: 0.2   # inelastic bounce on wall collision (1.0 = bouncy, 0.0 = sticky)
  max_force: 50.0          # maximum action magnitude (Newtons / unit mass)
  max_steps: 1000          # max timesteps per episode before forced reset
  grid_cell_size: 1.0     # meter resolution per occupancy/coverage cell
  # Placement: base at left-centre, target at right-centre (symmetry axis)
  base_x: 50.0
  base_y: 50.0
  target_x: 450.0
  target_y: 50.0
  radar_bins: 8          # B — number of angular radar slices (obs_dim = 8 + B*6)
  spawn_delay: 0        # steps between each drone's activation (0 = all start together)
  num_targets: 1         # 0 = exploration focus, 1 = find target goal
  num_bases: 1           # 0 = exploration focus, 1 = tethered relay goal
  exploration_sampling_radius: 20.0 # meter offset for local coverage grid sampling

# Reward weights -------------------------------------------------------------
reward:
  exploration_bonus: 0.02       # per square meter discovered (magnitude per map area)

  max_gap_penalty: 5.0          # absolute penalty when gap is at its maximum
  collision_penalty: 0.2        # per-agent absolute penalty per step spent in collision

  target_found_bonus: 250.0      # one-time bonus when target is first discovered
  success_bonus: 500.0          # one-shot terminal bonus when chain first closes episode

# Training -------------------------------------------------------------------
training:
  seed: 42
  use_mappo: true             # true = MAPPO (centralised critic), false = IPPO
  num_envs: 1024               # parallel vectorised environments (vmap)
  num_steps: 128               # rollout horizon per PPO update
  num_epochs: 4                # PPO gradient epochs per collected batch
  num_minibatches: 8           # batch split into this many minibatches per epoch
  lr: 3.0e-4                   # Adam learning rate
  gamma: 0.99                  # discount factor
  gae_lambda: 0.95             # GAE smoothing factor
  clip_eps: 0.2                # PPO clip ratio
  vf_coef: 0.5                 # value function loss weight
  ent_coef: 0.01               # entropy bonus weight
  max_grad_norm: 0.5           # gradient clipping norm
  total_timesteps: 50_000_000  # training budget

# Network architecture -------------------------------------------------------
network:
  hidden_dim: 256              # size of MLP hidden layers
  num_layers: 3                # depth of shared trunk MLP

# Logging & checkpointing ----------------------------------------------------
logging:
  project: "swarmecho"
  run_name: "ppo_run"
  wandb_mode: "disabled"
  wandb_project: "SwarmEcho"
  wandb_entity: null
  log_freq: 10
  video_freq: 50
  save_model: True
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs"
  suppress_xla_warnings: True

# Visualization --------------------------------------------------------------
visualize:
  renderer: "slow"           # "fast" (OpenCV, ~15s) or "slow" (Matplotlib, ~90s)
  comm_color: "#03fbff"  # Comm radius indicator color ("match_drone" or hex like "#ffffff")
  comm_fill_alpha: 0.02
  comm_edge_alpha: 0.50
  vis_color: "#03fbff"   # Visual radius indicator color
  vis_fill_alpha: 0.10
  vis_edge_alpha: 0.50


