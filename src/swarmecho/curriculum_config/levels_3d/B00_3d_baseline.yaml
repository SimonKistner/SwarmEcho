name: B00_3d_baseline
building: B00_baseline_cuboid

env:
  num_agents: 5
  dt: 0.1
  max_force: 20.0
  max_speed: 5.0
  drag: 0.9
  drone_radius: 0.25
  base_comm_radius: 6.0
  comm_radius: 5.0
  visual_radius: 4.0
  target_spawn_buffer: 0.5
  radar_bins: 8
  spawn_delay: 0
  hold_chain_for: 5
  max_steps: 700

reward:
  exploration_bonus: 0.25
  collision_penalty: 0.5
  finder_bonus: 50.0
  target_found_bonus: 100.0
  success_bonus: 500.0

training:
  updates: 1000
  num_envs: 256
  num_steps: 64
  num_epochs: 2
  num_minibatches: 8
  hidden_dim: 256
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  seed: 42
  output_dir: outputs/3d_baseline
  run_name: B00_3d_baseline
  log_every: 1
  checkpoint_every: 50
  eval_every: 50
  eval_episodes: 8
  wandb_mode: disabled
  wandb_project: SwarmEcho-3D
  checkpoint_path: null
