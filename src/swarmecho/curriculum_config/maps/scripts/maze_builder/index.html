<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmEcho 3D Building Studio</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui;background:#07101f;color:#e8eef9;--cyan:#35d9e7;--panel:#111c2f;--line:#2a3a55}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 65% 10%,#163354 0,#081321 44%,#050b15 100%)}header{height:72px;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #263750;background:#091425e8;backdrop-filter:blur(14px)}.brand{font-weight:800;letter-spacing:.04em;margin-right:auto}.brand small{display:block;color:#6f88aa;font-size:10px;letter-spacing:.2em}.pill,button,input,select{border:1px solid #334762;background:#111e32;color:#e8eef9;border-radius:8px;padding:8px 10px}button{cursor:pointer}button:hover{border-color:#5d789e}.primary{background:var(--cyan);color:#041116;border-color:var(--cyan);font-weight:800}.workspace{display:grid;grid-template-columns:210px minmax(520px,1fr) 250px;height:calc(100vh - 72px)}aside{background:#0b1628dd;border-right:1px solid #263750;padding:18px;overflow:auto}.right{border-right:0;border-left:1px solid #263750}.section{color:#6f88aa;text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:800;margin:12px 0 9px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tools button{padding:12px 5px;font-size:12px}.tools button.active{background:#15384a;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan);color:#9ff6ff}.wide{width:100%;margin:4px 0}.stage{position:relative;overflow:auto;padding:28px;display:flex;align-items:center;justify-content:center}.board-shell{padding:42px 52px 58px;background:linear-gradient(145deg,#14233a,#0a1425);border:1px solid #2a4160;border-radius:18px;box-shadow:0 35px 80px #0009;transform:perspective(1100px) rotateX(47deg) rotateZ(-2deg);transform-style:preserve-3d}.board{position:relative;background:#0c1728;border:2px solid #36506f;box-shadow:0 18px 0 #050b14,0 28px 35px #000b}.cell{position:absolute;border-right:1px solid #263950;border-bottom:1px solid #263950;background:#13243a;cursor:pointer}.cell:hover{background:#254562}.cell.interior{background:#28506a}.cell.floor{background:linear-gradient(135deg,#32718b,#22465f);box-shadow:inset 0 -5px #172f44}.cell.excluded{background:#7d3346}.cell.base:after{content:'B';position:absolute;inset:20%;display:grid;place-items:center;border-radius:50%;background:#56a9ff;color:white;font-weight:900;box-shadow:0 0 18px #56a9ff}.wall{position:absolute;background:#a5dce5;pointer-events:none;z-index:5;box-shadow:5px -6px 0 #426c7b,8px -9px 14px #0008}.wall.h{height:5px}.wall.v{width:5px}.hud{position:absolute;left:28px;top:22px;color:#7790b2;font-size:12px}.hud b{color:#dceafb}.status{font-size:12px;line-height:1.5;padding:10px;border:1px solid #2c415e;border-radius:9px;background:#0b1729;white-space:pre-wrap}.status.ok{border-color:#21c58b;color:#8cf0c7}.status.err{border-color:#e75a70;color:#ffb1bd}.field{display:grid;grid-template-columns:1fr 70px;align-items:center;gap:8px;margin:8px 0;font-size:12px;color:#9db0ca}.field input{width:70px}.layers{display:flex;gap:6px;align-items:center}.layers select{flex:1}.legend{font-size:11px;color:#8097b5;line-height:1.8}.sw{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:2px}.elevation{height:140px;display:flex;align-items:end;justify-content:center;gap:3px;padding:12px;border:1px solid #293d59;border-radius:10px;background:#081220}.level-block{width:58px;border:1px solid #55708e;background:#1a3e56aa;box-shadow:5px -4px 0 #0c2638}.kbd{font-size:11px;color:#6f88aa;margin-top:12px}dialog{background:#101d30;color:white;border:1px solid #3c5373;border-radius:12px;padding:20px}dialog select{min-width:300px}dialog::backdrop{background:#020712cc}
</style>
</head>
<body>
<header><div class="brand">SWARMECHO <small>3D BUILDING STUDIO</small></div><button id="newBtn">New</button><button id="openBtn">Open map</button><input id="name" value="custom_3d_building" aria-label="Map name"><label class="pill"><input id="overwrite" type="checkbox"> overwrite</label><button id="validateBtn">Validate</button><button class="primary" id="saveBtn">Save map</button></header>
<div class="workspace">
<aside><div class="section">Edit mode</div><div class="tools"><button data-mode="tiles" class="active">▦ Tiles</button><button data-mode="walls">▥ Walls</button><button data-mode="base">● Base</button><button data-mode="exclude">▧ No target</button></div><div class="section">Batch tools</div><button class="wide" id="outerBtn">Add outer walls</button><button class="wide" id="roofBtn">Add roof</button><div class="section">Storey</div><div class="layers"><button id="downBtn">↓</button><select id="layer"></select><button id="upBtn">↑</button></div><button class="wide" id="addLayerBtn">＋ Add layer</button><div class="section">Grid</div><label class="field">Columns <input id="cols" type="number" min="1" max="120"></label><label class="field">Rows <input id="rows" type="number" min="1" max="120"></label><button class="wide" id="resizeBtn">Reset to dimensions</button><p class="kbd">Tiles define usable cells and their lower floors. In Walls mode click near a cell edge.</p></aside>
<main class="stage"><div class="hud"><b id="title">Layer 1</b><br><span id="count"></span></div><div class="board-shell"><div id="board" class="board"></div></div></main>
<aside class="right"><div class="section">Structure</div><div id="elevation" class="elevation"></div><div class="legend"><div><i class="sw" style="background:#32718b"></i>floor / interior</div><div><i class="sw" style="background:#a5dce5"></i>solid wall</div><div><i class="sw" style="background:#7d3346"></i>target excluded</div><div><i class="sw" style="background:#56a9ff;border-radius:50%"></i>base spawn</div></div><div class="section">Training contract</div><div id="status" class="status">Loading starter building…</div></aside>
</div>
<dialog id="picker"><h3>Open existing v1 map</h3><select id="mapList"></select><p><button id="cancelOpen">Cancel</button> <button class="primary" id="confirmOpen">Open</button></p></dialog>
<script>
const $=id=>document.getElementById(id), key=c=>c.join(','), has=(list,c)=>new Set(list.map(key)).has(key(c));let doc,mode='tiles',layer=0,cell=48;
async function api(path,body){let r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||r.statusText);return j}
function toggle(list,c){let k=key(c),i=list.findIndex(v=>key(v)===k);if(i>=0)list.splice(i,1);else list.push(c);list.sort((a,b)=>key(a).localeCompare(key(b),undefined,{numeric:true}))}
function layers(){let s=$('layer');s.innerHTML='';for(let z=0;z<doc.layers;z++)s.add(new Option(`Level ${z+1}`,z));s.value=layer;$('title').textContent=`Level ${layer+1} · ${mode[0].toUpperCase()+mode.slice(1)}`}
function render(){if(!doc)return;layers();$('name').value=doc.name;$('cols').value=doc.cols;$('rows').value=doc.rows;cell=Math.max(26,Math.min(58,520/Math.max(doc.cols,doc.rows)));let b=$('board');b.innerHTML='';b.style.width=doc.cols*cell+'px';b.style.height=doc.rows*cell+'px';let ints=new Set(doc.interior_cells.map(key)),floors=new Set(doc.tiles.map(key)),ex=new Set(doc.target_exclusion_cells.map(key));for(let y=0;y<doc.rows;y++)for(let x=0;x<doc.cols;x++){let e=document.createElement('div'),c=[x,y,layer];e.className='cell'+(ints.has(key(c))?' interior':'')+(floors.has(key(c))?' floor':'')+(ex.has(key(c))?' excluded':'')+(key(doc.base_cell)===key(c)?' base':'');Object.assign(e.style,{left:x*cell+'px',top:y*cell+'px',width:cell+'px',height:cell+'px'});e.onclick=ev=>editCell(x,y,ev);b.append(e)}for(let w of doc.x_walls)if(w[2]===layer){let e=document.createElement('div');e.className='wall v';Object.assign(e.style,{left:w[0]*cell-2+'px',top:w[1]*cell+'px',height:cell+'px'});b.append(e)}for(let w of doc.y_walls)if(w[2]===layer){let e=document.createElement('div');e.className='wall h';Object.assign(e.style,{left:w[0]*cell+'px',top:w[1]*cell-2+'px',width:cell+'px'});b.append(e)}$('count').textContent=`${[...ints].filter(v=>v.endsWith(','+layer)).length} interior cells · ${doc.layers} total levels`;$('elevation').innerHTML='';for(let z=0;z<doc.layers;z++){let q=document.createElement('div');q.className='level-block';q.style.height=(32+z*7)+'px';q.style.opacity=z===layer?1:.35;q.title='Level '+(z+1);$('elevation').append(q)}}
function editCell(x,y,ev){let c=[x,y,layer],ints=new Set(doc.interior_cells.map(key));if(mode==='tiles'){if(key(doc.base_cell)===key(c)&&ints.has(key(c)))return status('Move the base before removing its cell.','err');toggle(doc.interior_cells,c);toggle(doc.tiles,c);if(!new Set(doc.interior_cells.map(key)).has(key(c)))doc.target_exclusion_cells=doc.target_exclusion_cells.filter(v=>key(v)!==key(c))}else if(mode==='exclude'){if(!ints.has(key(c)))return status('Select an interior tile first.','err');toggle(doc.target_exclusion_cells,c)}else if(mode==='base'){if(!ints.has(key(c)))return status('The base must be on an interior tile.','err');doc.base_cell=c;delete doc.base_position_m}else{let r=ev.currentTarget.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width,py=(ev.clientY-r.top)/r.height,m=Math.min(px,1-px,py,1-py);if(m===px)toggle(doc.x_walls,[x,y,layer]);else if(m===1-px)toggle(doc.x_walls,[x+1,y,layer]);else if(m===py)toggle(doc.y_walls,[x,y,layer]);else toggle(doc.y_walls,[x,y+1,layer])}render()}
function status(msg,type=''){let s=$('status');s.textContent=msg;s.className='status '+type}
async function validate(){doc.name=$('name').value;try{let j=await api('/api/buildings/validate',doc),r=j.report;status(`VALID BUILDING\n${r.interior_cells} interior cells\n${r.authored_solids} internal solids\n${r.target_candidate_cells} target cells\nWorld ${r.world_size_m.join(' × ')} m`,'ok');return true}catch(e){status(e.message,'err');return false}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});$('layer').onchange=e=>{layer=+e.target.value;render()};$('downBtn').onclick=()=>{layer=Math.max(0,layer-1);render()};$('upBtn').onclick=()=>{layer=Math.min(doc.layers-1,layer+1);render()};$('outerBtn').onclick=async()=>{try{doc=(await api('/api/buildings/outer-walls',{...doc,selected_layer:layer})).document;render();status('Outer walls added.')}catch(e){status(e.message,'err')}};$('roofBtn').onclick=async()=>{try{doc=(await api('/api/buildings/roof',doc)).document;render();status('Roof filled over every exposed top cell.')}catch(e){status(e.message,'err')}};$('addLayerBtn').onclick=()=>{doc.layers++;layer=doc.layers-1;render();status('Empty layer added. Paint its floor tiles, then add outer walls and roof.')};$('resizeBtn').onclick=async()=>{if(!confirm('Reset the complete building to these dimensions?'))return;try{doc=(await api('/api/buildings/new',{cols:+$('cols').value,rows:+$('rows').value,layers:doc.layers})).document;layer=0;render();status('Building reset to new dimensions.')}catch(e){status(e.message,'err')}};$('newBtn').onclick=()=>api('/api/buildings/new').then(j=>{doc=j.document;layer=0;render();status('New sealed starter building.')});$('validateBtn').onclick=validate;$('saveBtn').onclick=async()=>{doc.name=$('name').value;if(!await validate())return;try{let j=await api('/api/buildings/save',{...doc,overwrite:$('overwrite').checked});status(`Saved ${j.path}\nRun: python -m swarmecho.curriculum_config.maps.scripts.validate_building ${j.path}`,'ok')}catch(e){status(e.message,'err')}};$('openBtn').onclick=async()=>{try{let j=await api('/api/buildings');$('mapList').innerHTML='';j.maps.forEach(n=>$('mapList').add(new Option(n,n)));$('picker').showModal()}catch(e){status(e.message,'err')}};$('cancelOpen').onclick=()=>$('picker').close();$('confirmOpen').onclick=async()=>{try{doc=(await api('/api/buildings/'+encodeURIComponent($('mapList').value))).document;layer=0;$('picker').close();render();status('Existing v1 map loaded.')}catch(e){status(e.message,'err')}};api('/api/buildings/new').then(j=>{doc=j.document;render();status('Starter building is sealed and ready.','ok')});
</script>
</body></html>
