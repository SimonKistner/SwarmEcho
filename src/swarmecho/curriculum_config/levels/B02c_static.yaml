env:
  # Comment out two entries to use one classic static map.
  map_names:
    - B02c_static_map_02713
    #- B02c_static_map_02557
    #- B02c_static_map_02344

  num_agents: 7

  max_force: 50.0
  max_speed: 10.0
  drone_radius: 0.25

  comm_radius_base: 15.0
  base_keeps_informing: false
  comm_radius: 15.0
  visual_radius: 5.0
  radar_bins: 32

  max_steps: 1000
  success_condition: chain_held # coverage | discovery | delivery | chain_held

  observe_chain_contributor: true
  observe_current_timestep: false
  observe_coverage_probe: false
  coverage_voxel_size: 2.5

  roadmap_approach: "full" #"minimal"
  roadmap_node_density: 0.5
  roadmap_merge_wall_end_nodes: true
  roadmap_corner_bonus_m: 0.0

random_buildings:
  enabled: false

reward:
  target_found_requires_delivery: true
  chain_reward_system: obstacle_geodesic

  allow_redundancy_reward: false
  enable_chain_efficiency_reward: false
  chain_efficiency_bonus: 0

  exploration_bonus: 2.0
  target_found_bonus: 500.0
  finder_bonus: 100
  success_bonus: 12000.0
  success_bonus_as_hold_record: false
  peer_informing_reward_enabled: true
  peer_informing_bonus: 50.0

  collision_penalty: 0.5
  time_penalty_per_step: 3.0
  no_movement_termination_penalty: 0.0
  gap_reduction_meter_bonus: 0.2
  gap_reward_uses_change: false
  gap_change_meter_bonus: 3.0
  delivery_gap_vesting_enabled: false
  delivery_gap_vesting_steps: 10

training:
  total_timesteps: 800000000
  num_envs: 3500
  num_steps: 100
  num_epochs: 4
  num_minibatches: 20
  seed: 456789

  randomize_base: false
  minimum_geodesic_separation: true
  minimum_geodesic_separation_multiplier: 1.0
  skip_on_no_pair_found: true

network:
  hidden_dim: 256
  num_layers: 3
  actor_num_layers: 3
  memory_comm_enabled: true
  memory_comm_every_k_steps: 3
  tarmac_sig_dim: 32
  tarmac_val_dim: 64
  tarmac_include_self: false

evaluation:
  apply_trainings_min_geo_separation: true
  eval_parallel_envs: 3500
  random_eval: false
  replay_targets_from_storey: 3

  early_exit: true
  early_exit_success_rate: 0.99
  early_exit_min_success_length_reduction: 0.3 # 0.25 -> mean completion by step 450 of 600 (750 of 1000 here); to_test: null
  early_exit_hold_evals: 1

  save_model: true
  checkpoint_freq: 30
  eval_freq: 50

  training_heatmap_creation: true

  eval_video: true
  eval_video_freq: 50
  eval_video_offset: 1

logging:
  terminal_log_warmup: true
  terminal_log_init: true
