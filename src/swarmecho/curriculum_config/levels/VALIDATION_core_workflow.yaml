env:
  map_names: ["M01_small_maze"]
  num_agents: 6
  max_steps: 4
  spawn_delay: 0
  hold_chain_for: 50
  visual_radius: 5.0
  max_speed: 5.0
  max_force: 15.0
  comm_radius: 15.0
  comm_radius_base: 16.67

reward:
  chain_reward_system: discrete_finders_path

training:
  total_timesteps: 4
  num_envs: 2
  num_steps: 2
  num_epochs: 1
  num_minibatches: 1
  seed: 6302026950

network:
  hidden_dim: 16
  num_layers: 1
  actor_num_layers: 1
  actor_memory: true
  critic_memory: true
  memory_comm_enabled: true
  memory_comm_every_k_steps: 1
  tarmac_sig_dim: 4
  tarmac_val_dim: 8
  tarmac_include_self: false

evaluation:
  eval_freq: 1
  eval_offset: 0
  eval_parallel_envs: 2
  early_exit: true
  early_exit_threshold: 0.0

  eval_video: true
  eval_video_freq: 1
  eval_video_offset: 0

  eval_failed_chain_heatmap: true
  eval_not_delivered_or_visually_found_heatmap: true

  save_model: true
  checkpoint_freq: 1
  checkpoint_offset: 0

logging:
  run_name: "core_workflow_validation"
  use_timestamp_postfix: true
  wandb_mode: "disabled"
