# G03 PPO and rewards on one authored map with fixed same-map validation cases.
env:
  map_names:
  - C_curriculum/C03/C03_station.yaml
  num_agents: 7
  relay_agent_budget: null
  spawn_delay: 5
  max_force: 50.0
  max_speed: 10.0
  drone_radius: 0.25
  obstacle_planning_clearance_m: 0.1
  target_wall_buffer_fraction: 0.1
  comm_radius_base: 15.0
  base_keeps_informing: false
  comm_radius: 15.0
  visual_radius: 5.0
  wall_sensing_layout: fibonacci
  wall_sensing_rays: 32
  wall_sensing_ray_max_distance: 8.0
  drone_radar_bins: 32
  radar_mode: legacy
  distance_bands: 3
  radar_count_cap: 3
  max_steps: 700
  success_condition: chain_held_and_cleand_up
  hold_chain_for: 30
  observe_chain_contributor: true
  observe_decommission_zone: true
  observe_base_vote_ratio: false
  observe_base_population: true
  observe_seeing_target: false
  observe_visually_gated_target_displacement: true
  observe_current_timestep: false
  observe_coverage_probe: false
  coverage_voxel_size: 2.5
  roadmap_approach: full
  roadmap_node_density: 0.5
  roadmap_merge_wall_end_nodes: true
  roadmap_corner_bonus_m: 0.0
adapt_size:
  enabled: true
  recruitment_enabled: false
  initial_agents: 7
  vote_mode: hold
  vote_protocol: latest_decision
  decommission_radius_m: 0.75
  decommission_hold_steps: 5
  reward_by_reference_enabled: false
reward:
  reinforcement_reward: 0
  decommission_reward: 0
  non_contributor_return_reward_per_meter: 3.0
  non_contributor_departure_reward_per_meter: -3.0
  non_contributor_decommission_reward: 3000
  rejected_call_reward: 0
  all_decommissioned_penalty: -1000
  useless_agent_at_success_reward: -3000
  useless_agent_at_success_all_agents_reward: -750
  useless_agent_at_success_all_agents_reward_cap: -2000
  target_found_requires_delivery: true
  chain_reward_system: obstacle_geodesic
  progress_based_cluster_tiebreaker_soft: true
  allow_redundancy_reward: false
  enable_chain_efficiency_reward: true
  chain_efficiency_reward: 25.0
  exploration_reward: 2.0
  finder_reward: 100
  target_found_reward: 100
  success_reward: 3000
  success_reward_as_hold_record: false
  peer_informing_reward_enabled: false
  collision_reward: -0.5
  time_presure_reward: -0.75
  gap_progress_reward_per_meter: 0.2
  gap_reward_uses_change: false
  delivery_gap_vesting_enabled: false
  no_movement_termination_penalty: 0.0
training:
  total_timesteps: 5000000000
  max_wall_seconds: null
  max_training_seconds: 86400
  num_envs: 6000
  num_maps: 1
  oom_recovery:
    enabled: true
    parameter: optimizer_microbatches
    factor: 2.0
    max_retries: null
  num_steps: 50
  num_epochs: 3
  num_minibatches: 6
  optimizer_microbatches: 1
  rollout_batch_size: null
  base_memory_replay: differentiable
  target_curriculum:
    mode: forward
    start_agents: 3
    success_threshold: 0.75
  target_spawn_eligibility:
    enabled: true
    samples_per_map: 800
    minimum_cell_fraction: 0.01
  geo_probe_auxiliary:
    enabled: true
    observe_prev_path_probe: false
    lambda_target: 0.3
    metric_threshold: 0.8
    gradient_diagnostics: true
    head:
      hidden_sizes:
      - 256
      - 128
      learning_rate: 0.0003
    sampling:
      every_updates: 1
      snapshots_per_agent: 5
      selection: stratified_eligible_steps
    schedule:
      warmup_updates: 10
      ramp_updates: 100
  seed: 456789
  checkpoint_path: null
  randomize_base: false
  minimum_geodesic_separation: false
  skip_on_no_pair_found: true
  dynamic_max_geo_distance:
    enabled: true
    mode: global_candidates
    candidate_spacing_fraction: 0.5
    max_candidates_per_map: 16384 # The station needs 5,832 random points at G03 spacing, plus roadmap anchors.
network:
  hidden_dim: 256
  num_layers: 3
  actor_num_layers: 3
  memory_comm_enabled: true
  memory_comm_every_k_steps: 1
  tarmac_sig_dim: 32
  tarmac_val_dim: 64
  tarmac_include_self: false
inspection_evaluation:
  success_condition: chain_held
  seed: 456789
  num_agents: null
  dynamic_max_geo_distance: true
  target_sampling: independent
  apply_trainings_min_geo_separation: false
  eval_parallel_envs: 1000
  replay_targets_from_storey: null
  early_exit: true
  early_exit_source: validation
  early_exit_success_rate: 0.99
  final_early_exit_success_rate: 0.99
  early_exit_min_success_length_reduction: null
  early_exit_hold_evals: 1
  save_model: true
  checkpoint_freq: 30
  eval_freq: 100
  eval_min_train_success: 0.0
  training_robustness: false
  final_robustness: false
  eval_action_noise_max: 0.0
  training_heatmap_creation: false
  final_artifacts_only: true
  eval_video: true
  eval_video_freq: 100
  eval_video_offset: 0
logging:
  run_name: G03_space_station
  use_timestamp_postfix: false
  wandb_mode: online
  adaptive_cell_diagnostics: false
  individual_map_diagnostics: false
  required_agents_metrics_window_episodes: 500
  terminal_log_warmup: true
  terminal_log_init: true
validation:
  enabled: true
  success_condition: chain_held
  mode: uniform_full_task
  num_maps: 1
  num_episodes: 10000
  seed: 456789
  fixed_targets: true
  parallel_envs: 5000
  val_freq: 50
  val_on_finalization: true
  save_per_map_stats: true
  save_best_checkpoint: true
