# CLU G03 quickstart using the winning run’s training mechanisms.
# 3600 training maps, 400 separate validation maps and automatic seven-drone deployment.
env:
  map_names: [] # Persistent random buildings replace the authored G02 suite.

  num_agents: 7 # All seven drones are reserved for automatic initial deployment.
  spawn_delay: 5 # Minimum environment steps between automatic initial deployments.

  max_force: 50.0
  max_speed: 10.0
  drone_radius: 0.25
  obstacle_planning_clearance_m: 0.1 # Match the existing pool compilation settings.
  target_wall_buffer_fraction: 0.1

  comm_radius_base: 15.0
  comm_radius: 15.0
  visual_radius: 5.0
  wall_sensing_rays: 32 # Fibonacci directions
  wall_sensing_ray_max_distance: 8.0 # Metres; independent of target visual_radius.
  drone_radar_bins: 32
  radar_mode: legacy #| band_sep_counting
  distance_bands: 3
  radar_count_cap: 3

  max_steps: 700
  success_condition: chain_held_and_cleand_up # Hold the chain and decommission all active non-contributors.
  hold_chain_for: 30

  observe_chain_contributor: true
  observe_decommission_zone: true # Own membership in the valid decommission sphere (1 inside, 0 outside).
  observe_base_population: true # Active population / global DEPLOYED_AGENTS_OBS_REF (10); zero off-network.
  observe_visually_gated_target_displacement: true
  coverage_voxel_size: 2.5

  roadmap_node_density: 0.5
  roadmap_merge_wall_end_nodes: true

random_buildings:
  enabled: true
  advanced_exclustion_base_LOS: true # All in-range base-visible cells plus one around-corner cell when enabled.

  # Match the generation settings of the existing 5000-map, 15 m pool.
  # Source-fingerprint compatibility is checked separately by the bank loader.
  length_m: 15.0
  width_m: 15.0
  stories: 3
  cell_size_m: 5.0
  wall_thickness_m: 0.25
  tile_thickness_m: 0.25
  rooms_per_story_min: 2
  rooms_per_story_max: 4
  extra_door_probability: 0.15
  window_probability: 0.2
  staircase_max: 2

  save_training_maps: false
  load_maps_from_bank: true

adapt_size:
  enabled: true
  decommission_radius_m: 0.75 # Fits above a centred base inside a sealed 5 m shaft.
  decommission_hold_steps: 5 # Consecutive environment steps; exit resets dwell.



reward:
  decommission_reward: 0 # Full amount to each removed drone, on removal.

  non_contributor_return_reward_per_meter: 3.0 # Positive geodesic progress toward the decommission-zone centre while a chain is intact; no radius cutoff.
  non_contributor_departure_reward_per_meter: -3.0 # Cost per metre away from that centre, including inside the zone.
  non_contributor_decommission_reward: 3000 # One-shot surplus-agent exit reward if the chain survives; matches this level's success_reward.

  all_decommissioned_penalty: -1000 # Full signed amount to each last acting drone.
  useless_agent_at_success_reward: -3000 # Each active drone outside the selected success chain.
  useless_agent_at_success_all_agents_reward: -750 # Each active drone per useless drone at terminal chain success; max(-750 * useless_count, -2000). max limits the loss
  useless_agent_at_success_all_agents_reward_cap: -2000

  chain_efficiency_reward: 25.0 # Per eligible drone times its path efficiency; no population divisor.

  exploration_reward: 2.0 # Per new voxel; simultaneous viewers split that voxel's credit.
  finder_reward: 100 # Each direct base deliverer.
  target_found_reward: 100 # Full one-shot amount to every active drone when the target reaches base.
  success_reward: 3000 # Full amount to every active drone at first success; no population divisor.

  collision_reward: -0.5 # Per colliding drone per transition.
  time_presure_reward: -0.75 # Each acting drone every step, including its removal step.
  gap_progress_reward_per_meter: 0.2 # Recurring per credited closed metre each step; local soft shares remain.

training:
  total_timesteps: 1000000000 # Maximum environment steps across the run.
  max_wall_seconds: null # Setup/pool preparation does not consume the learning-comparison budget.
  max_training_seconds: 86400 # 24 hours of training after setup.
  num_envs: 6000
  num_maps: 3600 # Persistent training maps: 90% of the 4000-map dataset.
  oom_recovery:
    enabled: true
    parameter: optimizer_microbatches # Split execution while preserving the scientific PPO batch.
    factor: 2.0
    max_retries: null # Retry up to the valid execution-splitting limit.
  num_steps: 50
  num_epochs: 3
  num_minibatches: 6
  optimizer_microbatches: 1 # Execution chunks; accumulated before one PPO minibatch update.
  rollout_batch_size: null # Execution lanes; OOM recovery may chunk without changing num_envs.

  forward_target_curriculum:
    enabled: true

  target_spawn_eligibility:
    enabled: true # Startup preparation is independent of success-based adaptive spawning.
    samples_per_map: 800 # Accepted full-budget targets; shared cached per-cell requirement histograms.
    minimum_cell_fraction: 0.01 # Retain cells with at least 8 of the 800 accepted probes.

  geo_probe_auxiliary:
    lambda_target: 0.3
    metric_threshold: 0.8 # Thresholded similarity/exact masks; soft overlap and BCE have no cutoff.
    gradient_diagnostics: true # Existing training.diagnostics_every; one PPO minibatch.
    head:
      hidden_sizes: [256, 128]
      learning_rate: 0.0003 # Independent head optimizer, clipping and learning rate.
    sampling:
      every_updates: 1 # Outer PPO rollout/update, not a minibatch optimizer step.
      snapshots_per_agent: 5 # Up to K distinct eligible frames per slot/current rollout.
      selection: stratified_eligible_steps # One random frame from each time-ordered band.
    schedule:
      warmup_updates: 10 # PPO continues; auxiliary gradient into the policy stays zero.
      ramp_updates: 100 # Valid-supervision cycles 11..110 linearly reach lambda_target.
  seed: 456789
  map_selection_seed: 456789 # Freeze the winning training/held-out split.
  map_pool_path: null # Reuse a compatible bank or build one for a fresh run.
  checkpoint_path: null # Start fresh. Set ckpt_loading_mode=resume to continue an interrupted run.

  randomize_base: false

  dynamic_max_geo_distance:
    candidate_spacing_fraction: 0.5 # 216 accepted uniform-random points on a 15 m cube, plus legal roadmap/launch anchors.
    max_candidates_per_map: 4096 # Explicit preparation limit, never silent truncation.

  adaptive_target_spawn:
    enabled: false # Uniform target positions within target_curriculum's allowed groups.
    curriculum_start_agents: null # Use target_curriculum instead of the legacy adaptive-spawn gate.
    min_probability_fraction: 0.20
    success_window_episodes_per_cell: 500
    probability_smoothing_half_life_updates: 3.0
    plateau_warning_enabled: true
    plateau_warning_horizon_updates: 50
    plateau_warning_improvement_threshold_pp: 3.0

  adaptive_map_sampling:
    enabled: false # Uniform training-map selection.
    min_probability_fraction: 0.30 # Uniform map-selection floor; remaining mass prioritizes failures.
    success_window_episodes_per_map: 100 # 360000 completed episodes across 3600 maps before failure-based sampling.
    probability_smoothing_half_life_updates: 1.0
    eligibility_samples_per_map: 800 # Cell-support discovery budget, independent of live lane counts.

network:
  hidden_dim: 256
  num_layers: 3
  actor_num_layers: 3
  tarmac_sig_dim: 32
  tarmac_val_dim: 64

inspection_evaluation:
  success_condition: chain_held # Measure chain holding independently of training's surplus cleanup.
  seed: 456789 # Freeze inspection reset cases while training.seed varies.
  num_agents: null # Use the training agent cap in every eval/replay.
  target_sampling: independent # Inspection stays independent of the training curriculum.
  eval_parallel_envs: 1000 # Fixed per-map episode/lane budget: 3000 episodes across three validation maps.
  replay_targets_from_storey: null # Sample full-task eligible targets across storeys.
  inspection_maps: 3 # Fixed inspection subset from the 400 validation maps.

  early_exit: true
  early_exit_success_rate: 0.99 # Full-task stopping; target_curriculum has its own 75% group gate.
  final_early_exit_success_rate: 0.99 # Full-task validation threshold, independent of the virtual budget.
  early_exit_min_success_length_reduction: null # Success alone controls progression.
  early_exit_hold_evals: 1 # Consecutive qualifying validation passes.

  save_model: true
  checkpoint_freq: 30
  eval_freq: 100
  eval_min_train_success: 0.0 # Skip scheduled metrics/replays below this rolling training success.

  training_heatmap_creation: false # Scalar metrics during training; final heatmaps use frozen inspection maps.
  final_artifacts_only: true # Supported for random map suites; final checkpoint media only.

  eval_video: true
  eval_video_freq: 100
  eval_video_offset: 0
  map_suite_replay_limit: 5 # Upper limit; the three-map inspection suite records all three.

logging:
  run_name: G03
  use_timestamp_postfix: false
  wandb_mode: online
  adaptive_cell_diagnostics: false # Keep adaptive-cell state without dashboard histories or per-cell reports.
  individual_map_diagnostics: false # Summary metrics only; no individual-map traces.
  required_agents_metrics_window_episodes: 500 # Independent population/success window per exact target estimator count.
  terminal_log_warmup: true
  terminal_log_init: true

validation:
  enabled: true
  success_condition: chain_held # Full-task validation does not require surplus cleanup.

  # Validation maps and episodes.
  num_maps: 400
  num_episodes: 10000
  seed: 456789
  fixed_targets: true

  # Batch size does not affect the frozen cases.
  parallel_envs: 5000
  val_freq: 50
  val_on_finalization: true

  save_per_map_stats: true
  save_best_checkpoint: true
