# G03: G02 policy/task settings on 4000 persistent random buildings.
# See docs/02_guide/07_G03_random_buildings.md for remaining runtime verification and scaling work.
env:
  map_names: [] # Persistent random buildings replace the authored G02 suite.

  num_agents: 7 # Hard population cap and final geometric stage budget, including any spare slots.
  spawn_delay: 5 # Initial agents retain the normal stagger; voted reinforcements arrive immediately.

  max_force: 50.0
  max_speed: 10.0
  drone_radius: 0.25
  obstacle_planning_clearance_m: 0.1 # Match the existing pool compilation settings.
  target_wall_buffer_fraction: 0.1

  comm_radius_base: 15.0
  base_keeps_informing: false
  comm_radius: 15.0
  visual_radius: 5.0
  wall_sensing_layout: fibonacci # fibonacci (legacy) | xyz
  wall_sensing_rays: 32 # fibonacci: any integer >= 4; xyz: 14 | 18 | 26
  wall_sensing_ray_max_distance: 8.0 # Metres; independent of target visual_radius.
  drone_radar_bins: 32
  radar_mode: legacy #| band_sep_counting
  distance_bands: 3
  radar_count_cap: 3

  max_steps: 700
  success_condition: chain_held # coverage | discovery | delivery | chain_held

  observe_chain_contributor: true
  observe_base_vote_ratio: true # Qualified base voters / active population; zero off the base network.
  observe_base_population: true # Active population / global DEPLOYED_AGENTS_OBS_REF (10); zero off-network.
  observe_seeing_target: false
  observe_visually_gated_target_displacement: true
  observe_current_timestep: false
  observe_coverage_probe: false # Debugging-only legacy; never a design choice or candidate for any design question.
  coverage_voxel_size: 2.5

  roadmap_approach: full # Wall/opening/stair features supply the geodesic roadmap and relay anchors.
  roadmap_node_density: 0.5
  roadmap_merge_wall_end_nodes: true
  roadmap_corner_bonus_m: 0.0

random_buildings:
  enabled: true

  # Match the generation settings of the existing 5000-map, 15 m pool.
  # Source-fingerprint compatibility is checked separately by the bank loader.
  length_m: 15.0
  width_m: 15.0
  stories: 3
  cell_size_m: 5.0
  wall_thickness_m: 0.25
  tile_thickness_m: 0.25
  rooms_per_story_min: 2
  rooms_per_story_max: 4
  extra_door_probability: 0.15
  window_probability: 0.2
  staircase_max: 2

  save_training_maps: false
  load_maps_from_bank: true

adapt_size:
  enabled: true
  initial_agents: 1 # Each episode starts with one agent; voting can recruit up to the stage cap.
  vote_mode: hold # hold | keep_yes_no (KEEP=0, YES=1, NO=2)
  vote_protocol: latest_decision # credits | latest_decision; newest timestamped YES/NO per drone.
  vote_holding: 1 # Used only by credits; latest_decision always uses the latest YES/NO.
  quorum_fraction: 1.0 # Unanimity: every active drone must have qualified approval at the base.
  quorum_hold: 0 # Minimum consecutive environment steps with quorum; 0 acts immediately.
  decommission_radius_m: 0.75 # Fits above a centred base inside a sealed 5 m shaft.
  decommission_hold_steps: 15 # Consecutive environment steps; exit resets dwell.
  reward_by_reference_enabled: false # Extra signed reward for qualified reinforcement callers.
  reward_by_reference_fraction: 0.20 # Full share per caller; linearly decays to zero.
  reward_by_reference_steps: 500 # Environment transitions including the recruit's activation.


reward:
  reinforcement_reward: 10 # Full amount to each qualified deployment voter.
  priveleged_vote_reward: # Estimator/chain-aware vote penalties; suppress bonuses on unnecessary calls.
    enabled: true # false preserves existing rewards; requires latest_decision.
    withheld_reinforcement_vote_reward: -1.0 # Per informed, connected NO on an eligible communication tick.
    unnecessary_reinforcement_call_reward: -200 # Responsible YES sources on an unnecessary grant; replaces +10.
  decommission_reward: 0 # Full amount to each removed drone, on removal.
  rejected_call_reward: -200 # Each qualified YES voter on a rejected batch.
  all_decommissioned_penalty: -1000 # Full signed amount to each last acting drone.
  useless_agent_at_success_reward: -3000 # Each active drone outside the selected success chain.
  useless_agent_at_success_all_agents_reward: -750 # Each active drone per useless drone at terminal chain success; -min(750 * useless_count, 2000). min caps the loss
  useless_agent_at_success_all_agents_reward_cap: 2000
  target_found_requires_delivery: true
  chain_reward_system: obstacle_geodesic
  progress_based_cluster_tiebreaker_soft: true

  allow_redundancy_reward: false
  enable_chain_efficiency_reward: false
  chain_efficiency_reward: 0.0 # Per eligible drone times its path efficiency; no population divisor.

  exploration_reward: 2.0 # Per new voxel; simultaneous viewers split that voxel's credit.
  finder_reward: 100 # Each direct base deliverer, or first visual finder without delivery gating.
  target_found_reward: 100 # Full one-shot amount to every active drone at delivery/discovery.
  success_reward: 3000 # Full amount to every active drone at first success; no population divisor.
  success_reward_as_hold_record: false # If enabled: each qualifying holder gets success_reward / hold_chain_for per new record.
  peer_informing_reward_enabled: false
  peer_informing_reward: 50 # One newly informed peer's credit, split locally among direct senders.

  collision_reward: -0.5 # Per colliding drone per transition.
  time_presure_reward: -0.75 # Each acting drone every step, including its removal step.
  gap_progress_reward_per_meter: 0.2 # Recurring per credited closed metre each step; local soft shares remain.
  gap_reward_uses_change: false # Legacy diagnostic only; not a training design/tuning option.
  gap_change_reward_per_meter: 3.0 # Legacy diagnostic change-mode coefficient.
  delivery_gap_vesting_enabled: false # Legacy diagnostic companion to change mode.
  delivery_gap_vesting_steps: 10
  no_movement_termination_penalty: 0.0 # Full signed amount to each active drone at idle failure.

training:
  total_timesteps: 500000000
  num_envs: 4000 # Parallel lanes; OOM recovery may reduce this without changing the map split.
  num_maps: 3600 # Persistent training maps: 90% of the 4000-map dataset.
  oom_recovery:
    enabled: true
  num_steps: 100
  num_epochs: 4
  num_minibatches: 20
  seed: 456789

  randomize_base: false
  minimum_geodesic_separation: false
  minimum_geodesic_separation_multiplier: 0.5 # Inactive above; if enabled, minimum separation is 7.5 m.
  skip_on_no_pair_found: true

  dynamic_max_geo_distance:
    enabled: true
    mode: global_candidates # Cached whole-map radio graph; simplifier retains the previous estimator.
    candidate_spacing_fraction: 0.5 # 216 accepted uniform-random points on a 15 m cube, plus legal roadmap/launch anchors.
    max_candidates_per_map: 4096 # Explicit preparation limit, never silent truncation.
  agent_count_curriculum:
    enabled: true
    start_agents: 2
    additional_agents: 1 # Stage k allows min(k+1, env.num_agents) drones; targets stay certified with <=k.

  adaptive_target_spawn:
    enabled: true
    min_probability_fraction: 0.20
    success_window_episodes_per_cell: 500
    probability_smoothing_half_life_updates: 3.0
    plateau_warning_enabled: false
    plateau_warning_horizon_updates: 50
    plateau_warning_improvement_threshold_pp: 3.0

  adaptive_map_sampling:
    enabled: true
    min_probability_fraction: 0.30 # Uniform map-selection floor; remaining mass prioritizes failures.
    success_window_episodes_per_map: 100 # 360000 completed episodes across 3600 maps before failure-based sampling.
    probability_smoothing_half_life_updates: 1.0
    eligibility_samples_per_map: 800 # Cell-support discovery budget, independent of live lane counts.

network:
  hidden_dim: 256
  num_layers: 3
  actor_num_layers: 3
  memory_comm_enabled: true
  memory_comm_every_k_steps: 1
  tarmac_sig_dim: 32
  tarmac_val_dim: 64
  tarmac_include_self: false

inspection_evaluation:
  num_agents: null # Use the training agent cap in every eval/replay.
  dynamic_max_geo_distance: false # Follow the training filter; false explicitly disables it for diagnostic evaluation.
  apply_trainings_min_geo_separation: false
  eval_parallel_envs: 1000 # Fixed per-map episode/lane budget: 3000 episodes across three held-out maps.
  replay_targets_from_storey: null # Sample the current stage's eligible targets across storeys.
  inspection_maps: 3 # Fixed inspection subset from the 400 validation maps.

  early_exit: true
  early_exit_source: validation
  early_exit_success_rate: 0.85
  final_early_exit_success_rate: 0.99 # Only when target budget and population cap both reach seven.
  early_exit_min_success_length_reduction: null # Success alone controls progression.
  early_exit_hold_evals: 1 # Fresh windows per map for training source; eval calls otherwise.

  save_model: true
  checkpoint_freq: 30
  eval_freq: 100
  eval_min_train_success: 0.0 # Skip scheduled metrics/replays below this rolling training success.
  training_robustness: false
  final_robustness: false # Reuse the single noise-free metric pass at completion.
  eval_action_noise_max: 0.0

  training_heatmap_creation: true

  eval_video: true
  eval_video_freq: 100
  eval_video_offset: 0
  map_suite_replay_limit: 5 # Upper limit; the three-map inspection suite records all three.

logging:
  adaptive_cell_diagnostics: false # Keep adaptive-cell state without dashboard histories or per-cell reports.
  individual_map_diagnostics: false # Summary metrics only; no individual-map traces.
  required_agents_metrics_window_episodes: 500 # Independent population/success window per exact target estimator count.
  terminal_log_warmup: true
  terminal_log_init: true

validation:
  enabled: true

  # Held-out maps and validation episodes; no heatmaps or replays.
  num_maps: 400
  num_episodes: 10000
  seed: 456789
  fixed_targets: true

  # Batch size does not affect the frozen cases.
  parallel_envs: 500
  val_freq: 50
  val_on_finalization: true

  save_per_map_stats: true
  save_best_checkpoint: true
