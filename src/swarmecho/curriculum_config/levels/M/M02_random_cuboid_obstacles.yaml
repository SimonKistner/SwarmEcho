env:
  map_names:
  - M01_no_maze_open_cuboid_tall

  num_agents: 5

  drone_radius: 0.25

  comm_radius_base: 8.0
  comm_radius: 9.0
  visual_radius: 5.0
  wall_sensing_layout: fibonacci # fibonacci (legacy) | xyz
  wall_sensing_rays: 16 # fibonacci: any integer >= 4; xyz: 14 | 18 | 26
  wall_sensing_ray_max_distance: 8.0 # Metres; independent of target visual_radius.
  drone_radar_bins: 16

  spawn_delay: 5

  max_steps: 700
  hold_chain_for: 50
  no_movement_termination_steps: 50

  observe_target_vector: false # Debugging-only legacy; never a design choice or candidate for any design question.
  observe_base_vector: false # Debugging-only legacy; never a design choice or candidate for any design question.
  observe_coverage_probe: false # Debugging-only legacy; never a design choice or candidate for any design question.
  coverage_voxel_size: 2.5

  num_obstacles: 3
  obstacle_size_min_m: 5.0
  obstacle_size_max_m: 15.0
  obstacle_spawn_layer_min: 2
  obstacle_spawn_layer_max: 5
  obstacle_boundary_buffer_m: 0.5
  obstacle_target_buffer_m: 0.5
  obstacle_planning_clearance_m: 0.15
  obstacle_layout_version: three_aabb_v1

reward:
  target_found_requires_delivery: true
  chain_reward_system: obstacle_geodesic

  exploration_bonus: 0.25
  finder_bonus: 50.0
  target_found_bonus: 100.0
  success_bonus: 500.0

  collision_penalty: 0.5
  time_penalty_per_step: 5.0

# TODO: The reward system changed; this level's legacy rewards are no longer supported.
# Replace the original reward block above with these RewardConfig defaults, then retune this level.
# Optional switches below are global defaults; restore level-specific choices as needed.
# reward:
#   reinforcement_reward: 1.0 # Full amount to each qualified deployment voter.
#   decommission_reward: 0.0 # Full amount to each removed drone, on removal.
#   rejected_call_reward: -200.0 # Each qualified YES voter on a rejected batch.
#   all_decommissioned_penalty: -1000.0 # Full signed amount to each last acting drone.
#   useless_agent_at_success_reward: -3000.0 # Each active drone outside the selected success chain.
#   useless_agent_at_success_all_agents_reward: -750.0 # Each active drone per useless drone at terminal chain success; no population divisor.
#   useless_agent_at_success_all_agents_reward_cap: 2000.0 # Limits the absolute adjustment per active drone so useful success remains rewarding.
#   target_found_requires_delivery: true
#   chain_reward_system: euclidean
#   progress_based_cluster_tiebreaker_soft: false

#   allow_redundancy_reward: false
#   enable_chain_efficiency_reward: false
#   chain_efficiency_reward: 0.0 # Per eligible drone times its path efficiency; no population divisor.

#   exploration_reward: 2.0 # Per new voxel; simultaneous viewers split that voxel's credit.
#   finder_reward: 100.0 # Each direct base deliverer, or first visual finder without delivery gating.
#   target_found_reward: 125.0 # Full one-shot amount to every active drone at delivery/discovery.
#   success_reward: 3000.0 # Full amount to every active drone at first success; no population divisor.
#   success_reward_as_hold_record: false
#   peer_informing_reward_enabled: false
#   peer_informing_reward: 50.0

#   collision_reward: -0.5 # Per colliding drone per transition.
#   time_presure_reward: -0.75 # Each acting drone every step, including its removal step.
#   gap_progress_reward_per_meter: 0.2
#   gap_reward_uses_change: false
#   gap_change_reward_per_meter: 3.0 # Multiplies signed changes in each drone's credited metres.
#   delivery_gap_vesting_enabled: false
#   delivery_gap_vesting_steps: 10
#   no_movement_termination_penalty: 0.0 # Full signed amount to each active drone at idle failure.

training:
  total_timesteps: 500000000
  num_envs: 4000
  num_steps: 100
  num_epochs: 4
  num_minibatches: 20
  seed: 6302026950

  training_noise: false
  noise_level: 0.011

network:
  num_layers: 3
  actor_num_layers: 3

  actor_memory: true
  critic_memory: true
  critic_type: observation

  memory_comm_enabled: true
  memory_comm_every_k_steps: 3
  tarmac_sig_dim: 16
  tarmac_val_dim: 32
  tarmac_include_self: false

evaluation:
  eval_parallel_envs: 4000
  eval_fixed_obstacle_bounds:
  - [1.0, 5.0, 7.0, 14.0, 15.0, 10.0]
  - [8.0, 3.0, 13.0, 16.0, 18.0, 15.0]
  - [7.5, 7.5, 20.0, 12.5, 12.5, 26.0]

  early_exit: true
  early_exit_success_rate: 0.999
  eval_broadcast_on_curriculum_early_stop: false

  save_model: true
  checkpoint_freq: 50
  checkpoint_offset: 1
  eval_freq: 30
  eval_offset: 1

  training_heatmap_creation: false

  eval_video: true
  eval_video_freq: 9999999999
  eval_video_offset: 1
