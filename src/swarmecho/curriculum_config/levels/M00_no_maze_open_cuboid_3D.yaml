env:
  map_names: ["M00_no_maze_open_cuboid"]
  num_agents: 4
  max_steps: 500
  no_movement_termination_steps: 50
  visual_radius: 4.0
  max_speed: 5.0
  max_force: 15.0
  comm_radius: 8.0
  comm_radius_base: 6.0
  radar_bins: 8
  spawn_delay: 5
  hold_chain_for: 50
  drone_radius: 0.25
  target_spawn_buffer: 0.5
  coverage_voxel_size: 2.5
  observe_target_vector: false
  observe_base_vector: false
  observe_coverage_probe: true

reward:
  target_found_requires_delivery: true
  chain_reward_system: euclidean

  # --- Local Rewards (Not divided by N) ---
  exploration_bonus: 0.25
  finder_bonus: 50.0
  max_gap_penalty: 5.0
  collision_penalty: 0.5

  # --- Global Rewards (Divided by N) ---
  target_found_bonus: 100.0
  success_bonus: 500.0

training:
  total_timesteps: 500_000_000
  num_envs: 4000
  num_steps: 100
  num_epochs: 4
  num_minibatches: 20
  seed: 6302026950

  # checkpoint_path: "outputs/previous_run/checkpoints/ckpt_000500"
  # ckpt_loading_mode: "branch"

network:
  num_layers: 3
  actor_num_layers: 3
  actor_memory: true
  critic_memory: true
  critic_type: "observation"
  memory_comm_enabled: true
  memory_comm_every_k_steps: 3
  tarmac_sig_dim: 16
  tarmac_val_dim: 32
  tarmac_include_self: false

evaluation:
  eval_parallel_envs: 4000
  eval_broadcast_on_curriculum_early_stop: false
  early_exit: true
  early_exit_threshold: 0.999

  save_model: true
  checkpoint_freq: 50
  checkpoint_offset: 1

  eval_freq: 20
  eval_offset: 1
  eval_not_delivered_or_visually_found_heatmap: false

  eval_video: true
  eval_video_freq: 9999999999
  eval_video_offset: 1
