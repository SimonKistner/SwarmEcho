env:
  map_names: []

  num_agents: 8

  max_force: 75.0
  max_speed: 15.0
  drone_radius: 0.25

  comm_radius_base: 15.0
  base_keeps_informing: false
  comm_radius: 15.0
  visual_radius: 5.0
  wall_radar_bins: 16
  drone_radar_bins: 16

  max_steps: 600
  success_condition: discovery # coverage | discovery | delivery | chain_held

  observe_chain_contributor: true
  observe_current_timestep: false
  observe_coverage_probe: false
  coverage_voxel_size: 2.5

  roadmap_approach: "full" #"minimal"
  roadmap_node_density: 0.5
  roadmap_merge_wall_end_nodes: true
  roadmap_corner_bonus_m: 2.0

random_buildings:
  enabled: true

  length_m: 20.0
  width_m: 20.0
  stories: 3
  cell_size_m: 5.0

  rooms_per_story_min: 2
  rooms_per_story_max: 5
  staircase_max: 2

  save_training_maps: false
  load_maps_from_bank: true

reward:
  target_found_requires_delivery: false
  chain_reward_system: obstacle_geodesic

  allow_redundancy_reward: true
  enable_chain_efficiency_reward: false
  chain_efficiency_bonus: 0

  exploration_bonus: 0.25
  finder_bonus: 0.0
  target_found_bonus: 0.0
  success_bonus: 100.0

  collision_penalty: 0.5
  time_penalty_per_step: 5.0

training:
  total_timesteps: 500000000
  num_envs: 400
  num_steps: 100
  num_epochs: 4
  num_minibatches: 20
  seed: 555

  randomize_base: true
  minimum_geodesic_separation: true
  minimum_geodesic_separation_multiplier: 1.5
  skip_on_no_pair_found: true
  spawn_pair_max_attempts: 1500


network:
  memory_comm_enabled: true
  memory_comm_every_k_steps: 3
  tarmac_sig_dim: 16
  tarmac_val_dim: 32
  tarmac_include_self: false

evaluation:
  apply_trainings_min_geo_separation: true
  eval_parallel_envs: 600
  random_eval: true
  replay_targets_from_storey: 3
  random_eval_envs: 5
  eval_differes_from_training_map: false
  eval_map: null

  training_robustness: false
  eval_robustness_runs: 5

  early_exit: true
  early_exit_success_rate: 0.9
  early_exit_min_success_length_reduction: 0.25 # 0.25 -> mean completion by step 450 of 600; to_test: null
  early_exit_hold_evals: 3
  eval_broadcast_on_curriculum_early_stop: false

  save_model: true
  checkpoint_freq: 50
  checkpoint_offset: 1
  eval_freq: 10
  eval_offset: 1

  training_heatmap_creation: true

  eval_video: true
  eval_video_freq: 80
  eval_video_offset: 1

logging:
  terminal_log_warmup: true
  terminal_log_init: true
