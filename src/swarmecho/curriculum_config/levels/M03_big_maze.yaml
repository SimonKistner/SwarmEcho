# M03 Big Maze – single target, relay-chain training.
# Map: 9×9 cell grid, 10 m per cell (cell = visual_radius × 2), 90×90 m total.

env:
  map_names: ["M03_big_maze"]
  num_agents: 8
  max_steps: 1000
  visual_radius: 5.0
  max_speed: 4.17   # 10.0 * 5/12
  max_force: 20.83  # 50.0 * 5/12
  comm_radius: 20.83       # 50.0 * 5/12
  comm_radius_base: 16.67  # 40.0 * 5/12
  spawn_delay: 5
  hold_chain_for: 50
  observe_target_vector: false
  observe_base_vector: false

reward:
  target_found_requires_delivery: true
  chain_reward_system: discrete_finders_path

  # --- Local Rewards (Not divided by N) ---
  exploration_bonus: 0.25
  finder_bonus:  50.0
  max_gap_penalty: 5.0      # absolute penalty when gap is at its maximum
  target_found_bonus: 100.0
  success_bonus: 500.0

training:
  total_timesteps: 1_000_000_000
  num_envs: 4000
  num_steps: 100
  num_epochs: 4
  num_minibatches: 20
  seed: 14141414

network:
  num_layers: 3    # critic depth
  actor_num_layers: 3    # actor depth (lighter, separate)
  actor_memory: true
  critic_memory: true
  memory_comm_enabled: true
  memory_comm_every_k_steps: 5
  tarmac_sig_dim: 64
  tarmac_val_dim: 128
  tarmac_include_self: true

evaluation:
  eval_parallel_envs: 4000
  early_exit: true
  early_exit_threshold: 1.0

  checkpoint_freq: 50
  checkpoint_offset: 0

  eval_freq: 50
  eval_offset: 1
  eval_not_delivered_or_visually_found_heatmap: true

  eval_video: true
  eval_video_freq: 100
  eval_video_offset: 1

