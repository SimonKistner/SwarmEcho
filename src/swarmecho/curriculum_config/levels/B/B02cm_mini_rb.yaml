env:
  map_names: []

  num_agents: 7

  max_force: 50.0
  max_speed: 10.0
  drone_radius: 0.25

  comm_radius_base: 15.0
  base_keeps_informing: false
  comm_radius: 15.0
  visual_radius: 5.0
  wall_sensing_layout: fibonacci # fibonacci (legacy) | xyz
  wall_sensing_rays: 32 # fibonacci: any integer >= 4; xyz: 14 | 18 | 26
  wall_sensing_ray_max_distance: 8.0 # Metres; independent of target visual_radius.
  drone_radar_bins: 32
  radar_mode: band_sep_counting
  distance_bands: 4
  radar_count_cap: 3

  max_steps: 1000
  success_condition: chain_held # coverage | discovery | delivery | chain_held

  observe_chain_contributor: true
  observe_current_timestep: false
  observe_coverage_probe: false # Debugging-only legacy; never a design choice or candidate for any design question.
  coverage_voxel_size: 2.5

  roadmap_approach: "full" #"minimal"
  roadmap_node_density: 0.5
  roadmap_merge_wall_end_nodes: true
  roadmap_corner_bonus_m: 0.0

random_buildings:
  enabled: true

  length_m: 15.0
  width_m: 15.0
  stories: 3
  cell_size_m: 5.0

  rooms_per_story_min: 2
  rooms_per_story_max: 4
  staircase_max: 2

  save_training_maps: false
  load_maps_from_bank: true

reward:
  target_found_requires_delivery: true
  chain_reward_system: obstacle_geodesic

  allow_redundancy_reward: true
  enable_chain_efficiency_reward: false
  chain_efficiency_bonus: 0

  exploration_bonus: 2.0
  target_found_bonus: 500.0
  finder_bonus: 100
  success_bonus: 3000.0
  success_bonus_as_hold_record: true
  peer_informing_reward_enabled: true
  peer_informing_bonus: 15.0

  collision_penalty: 0.5
  time_penalty_per_step: 1.0
  no_movement_termination_penalty: 0.0
  gap_reduction_meter_bonus: 0.2
  gap_reward_uses_change: false
  gap_change_meter_bonus: 3.0
  delivery_gap_vesting_enabled: false
  delivery_gap_vesting_steps: 10

# TODO: The reward system changed; this level's legacy rewards are no longer supported.
# Replace the original reward block above with these RewardConfig defaults, then retune this level.
# Optional switches below are global defaults; restore level-specific choices as needed.
# reward:
