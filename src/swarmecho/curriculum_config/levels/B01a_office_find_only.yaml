env:
  map_names:
  - office_mirrored_free_spawn

  num_agents: 6

  max_force: 75.0
  max_speed: 15.0
  drone_radius: 0.25

  comm_radius_base: 30.0
  comm_radius: 30.0
  visual_radius: 16.0
  wall_radar_bins: 16
  drone_radar_bins: 16

  spawn_delay: 5

  max_steps: 500
  hold_chain_for: 50
  no_movement_termination_steps: 50
  success_condition: discovery

  observe_target_vector: false
  observe_base_vector: false
  observe_chain_contributor: true
  observe_current_timestep: true
  observe_coverage_probe: false
  coverage_voxel_size: 5.0 # 9 x 20 x 3 = 540 voxels (8x fewer than at 2.5 m)

reward:
  target_found_requires_delivery: false
  chain_reward_system: obstacle_geodesic

  allow_redundancy_reward: false
  enable_chain_efficiency_reward: false
  chain_efficiency_bonus: 0

  exploration_bonus: 0.25
  finder_bonus: 0.0
  target_found_bonus: 0.0
  success_bonus: 0.0

  collision_penalty: 0.5
  time_penalty_per_step: 5.0

training:
  total_timesteps: 300000000
  num_envs: 4000
  num_steps: 100
  num_epochs: 4
  num_minibatches: 20
  seed: 55555555

  actor_clip_eps: 0.2
  value_clip_eps: 0.2 # Normalized value units below; null disables clipping (not 0).
  entropy_mode: squashed
  value_normalization: running

  training_noise: false
  noise_level: 0.011

  randomize_base: true
  minimum_geodesic_separation: true
  minimum_geodesic_separation_multiplier: 2

network:
  num_layers: 3
  actor_num_layers: 3

  actor_memory: true
  critic_memory: true
  critic_type: observation

  memory_comm_enabled: true
  memory_comm_every_k_steps: 3
  tarmac_sig_dim: 16
  tarmac_val_dim: 32
  tarmac_include_self: false

evaluation:
  eval_parallel_envs: 4000
  eval_differes_from_training_map: true
  eval_map: "office_mirrored"

  training_robustness: false
  eval_robustness_runs: 5

  early_exit: true
  early_exit_success_rate: 0.995
  early_exit_hold_evals: 1
  eval_broadcast_on_curriculum_early_stop: false

  save_model: true
  checkpoint_freq: 50
  checkpoint_offset: 1
  eval_freq: 10
  eval_offset: 1

  training_heatmap_creation: true

  eval_video: true
  eval_video_freq: 100
  eval_video_offset: 1
