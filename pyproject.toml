[project]
name = "swarmecho"
version = "0.1.0"
description = "JAX-accelerated MARL drone swarm for delay-tolerant communication chain formation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core JAX stack — CUDA 12 build (Linux/WSL2 only)
    "jax[cuda12]>=0.4.30",
    "flax>=0.10.0", # NNX API (modern Flax)
    "optax>=0.2.4", # Gradient transformations / optimizers
    "chex>=0.1.86", # Shape/dtype assertions + dataclass utils
    "numpy>=1.26.0",
    # Config
    "omegaconf>=2.3.0", # Hierarchical YAML config with dot-notation + CLI overrides
    "pyyaml>=6.0.0",
    # Map loading and preprocessing
    "pillow>=10.3.0",
    "scipy>=1.13.0",
    # Logging & visualization
    "wandb>=0.18.0",
    "opencv-python-headless>=4.9.0", # Fast OpenCV renderer
    "imageio[ffmpeg]>=2.35.0", # Video writing (no system ffmpeg dep needed)
    "pandas>=2.2.0",
    # Checkpointing
    "orbax-checkpoint>=0.10.0", # Modern JAX checkpoint standard (DeepMind)
    "tqdm>=4.66.0",
    "streamlit>=1.56.0",
    "plotly>=6.0.0",
    "python-fasthtml>=0.14.3",
]

[project.scripts]
swarmecho-train = "swarmecho.training.train:main"
swarmecho-multi-train = "swarmecho.training.multi_train:main"
swarmecho-curriculum = "swarmecho.training.curriculum:run_curriculum"
swarmecho-evaluate = "swarmecho.training.evaluate:main"
swarmecho-evaluate-pipeline = "swarmecho.training.evaluate_pipeline:main"
swarmecho-grid-search = "swarmecho.training.grid_search:main"
swarmecho-render = "swarmecho.visualize.render_preview:main"
swarmecho-validate = "swarmecho.training.validate_core_workflow:main"
swarmecho-verify-connectivity = "swarmecho.training.verify_connectivity:main"
swarmecho-maze-builder = "swarmecho.curriculum_config.maps.scripts.maze_builder.maze_builder_server:main"
swarmecho-validate-building = "swarmecho.curriculum_config.maps.scripts.validate_building:main"
swarmecho-verify-maze = "swarmecho.curriculum_config.maps.scripts.verify_chain_maze:main"
swarmecho-dashboard = "swarmecho.analysis.launch:dashboard_main"
swarmecho-eval-dashboard = "swarmecho.analysis.launch:eval_dashboard_main"
swarmecho-artefacts = "swarmecho.analysis.artefacts.server:main"
swarmecho-benchmark-3d = "swarmecho.training.benchmark_3d:main"
swarmecho-validate-3d = "swarmecho.training.validate_3d_workflow:main"
swarmecho-train-3d = "swarmecho.training.train3d:main"
swarmecho-multi-train-3d = "swarmecho.training.multi_train3d:main"
swarmecho-curriculum-3d = "swarmecho.training.curriculum3d:main"
swarmecho-evaluate-3d = "swarmecho.training.evaluate3d:main"
swarmecho-inspect-3d = "swarmecho.visualize.inspector3d:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmecho"]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.pip]
system = false  # always use the project's venv

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]

# ---------------------------------------------------------------------------
# Development / linting extras (optional, not required for training)
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "ruff>=0.4.0", # fast linter + formatter
]
