[project]
name = "swarmecho"
version = "0.1.0"
description = "JAX-accelerated MARL drone swarm for delay-tolerant communication chain formation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core JAX stack — CUDA 12 build (Linux/WSL2 only)
    "jax[cuda12]>=0.4.30",
    "flax>=0.10.0", # NNX API (modern Flax)
    "optax>=0.2.4", # Gradient transformations / optimizers
    "chex>=0.1.86", # Shape/dtype assertions + dataclass utils
    # Config
    "omegaconf>=2.3.0", # Hierarchical YAML config with dot-notation + CLI overrides
    # Logging & visualization
    "wandb>=0.18.0",
    "matplotlib>=3.9.0",
    "opencv-python-headless>=4.9.0", # Fast OpenCV renderer
    "imageio[ffmpeg]>=2.35.0", # Video writing (no system ffmpeg dep needed)
    # Checkpointing
    "orbax-checkpoint>=0.10.0", # Modern JAX checkpoint standard (DeepMind)
    "tqdm>=4.66.0",
    "streamlit>=1.56.0",
    "scikit-learn>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/env", "src/models", "src/training", "src/visualize", "src/curriculum_config", "src/tests"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.pip]
system = false  # always use the project's venv

# ---------------------------------------------------------------------------
# Development / linting extras (optional, not required for training)
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",    # fast linter + formatter
    "pytest>=8.2.0",
    "streamlit>=1.35.0",
    "pillow>=10.3.0",
]
